# ---------------------------------------------------------------------------
# Home Assistant — Tenda Beli, fully local
#
# In configuration.yaml:
#
#     switch: !include switches.yaml
#
# In switches.yaml, paste everything below. Do NOT repeat the "switch:" key
# inside an !include-d file: the key lives in configuration.yaml, the file
# holds only the value.
# ---------------------------------------------------------------------------

- platform: rest
  name: "Power Strip PLUG1"
  unique_id: tenda_plug1
  resource: "http://192.168.1.50:5000/setSta"
  state_resource: "http://192.168.1.50:5000/getSta"
  body_on: '{"sub_device":[{"dev_name":"PLUG1","action":1}]}'
  body_off: '{"sub_device":[{"dev_name":"PLUG1","action":0}]}'
  is_on_template: >-
    {{ value_json.data.sub_device | selectattr('mark','equalto','PLUG1')
       | map(attribute='status') | first == 1 }}
  headers:
    Content-Type: application/json
  scan_interval: 15

